# Contract: docs/workflows/schemathesis-scan.md
name: "Reusable: Schemathesis Contract Tests"

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
        description: "Directory holding the schema, relative to the repo root"
      system-name:
        required: true
        type: string
        description: "System name for display (e.g. StPeter-API)"
      base-url:
        required: true
        type: string
        description: "Root URL of the DEPLOYED api under test"
      schema-path:
        required: false
        type: string
        default: ""
        description: "OpenAPI document inside the repo. Leave empty to discover the build-time document"
      schema-url-path:
        required: false
        type: string
        default: ""
        description: "Fetch the schema from the running service at this path instead of from a file"
      checks:
        required: false
        type: string
        default: "all"
        description: "Which properties to assert. 'all' covers 5xx, schema conformance, status codes and content types"
      max-examples:
        required: false
        type: number
        default: 50
        description: "Cases generated per operation. Higher finds more and takes longer"
      schemathesis-version:
        required: false
        type: string
        default: "4.26.1"
        description: "Pinned so a run is reproducible"
      python-version:
        required: false
        type: string
        default: "3.13"
        description: "Python used to run Schemathesis"
      health-path:
        required: false
        type: string
        default: "/health"
        description: "Path polled until the deployment answers, before any test runs"
      health-timeout-seconds:
        required: false
        type: number
        default: 120
        description: "How long to wait for the deployment to answer before giving up"
      fail-on-failure:
        required: false
        type: boolean
        default: true
        description: "Fail the job when a contract violation is found. False reports without blocking"
      checkout-ref:
        required: false
        type: string
        default: ""
        description: "Optional git ref/SHA to checkout, used by workflow_run chains"
    outputs:
      contract-result:
        description: "Contract test pass/fail"
        value: ${{ jobs.schemathesis-scan.outputs.result }}
      operations-tested:
        description: "API operations exercised. 0 means the schema described nothing"
        value: ${{ jobs.schemathesis-scan.outputs.operations }}
      failures:
        description: "Distinct contract violations found, 0 when clean"
        value: ${{ jobs.schemathesis-scan.outputs.failures }}

permissions:
  contents: read

jobs:
  schemathesis-scan:
    name: "Contract Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      result: ${{ steps.verdict.outcome }}
      operations: ${{ steps.verdict.outputs.operations }}
      failures: ${{ steps.verdict.outputs.failures }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 1

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      # A missing schema is reported, never skipped. Schemathesis generates its
      # cases FROM the schema, so without one there is nothing to test — and a
      # skipped contract check reads as "nothing to worry about" when it
      # actually means the api shipped with its contract unverified.
      - name: Locate Schema
        id: schema
        env:
          WORKDIR: ${{ inputs.working-directory }}
          SCHEMA_PATH: ${{ inputs.schema-path }}
          SCHEMA_URL_PATH: ${{ inputs.schema-url-path }}
        run: |
          set -euo pipefail

          # Served by the running api, so nothing local to find.
          if [ -n "${SCHEMA_URL_PATH}" ]; then
            echo "mode=url" >> "$GITHUB_OUTPUT"
            echo "Schema will be fetched from the deployment at ${SCHEMA_URL_PATH}."
            exit 0
          fi

          root="${WORKDIR%/}"
          root="${root#./}"

          if [ -n "${SCHEMA_PATH}" ]; then
            candidate="${root:+${root}/}${SCHEMA_PATH#/}"
            if [ ! -f "${candidate}" ]; then
              echo "::error::No OpenAPI document at ${candidate}. The API contract was not tested."
              exit 1
            fi
          else
            # The .NET build writes <Project>.json beside the csproj. Discover
            # it rather than making every caller spell out a path that the
            # build already decides.
            candidate="$(find "${root:-.}" -path '*/obj/*' -prune -o -path '*/bin/*' -prune -o -name '*.json' -print 2>/dev/null \
              | xargs -r grep -l '"openapi"' 2>/dev/null | head -n 1 || true)"

            if [ -z "${candidate}" ]; then
              echo "::error::No OpenAPI document found under ${root:-.}. Build the project first, or set schema-path. The API contract was not tested."
              exit 1
            fi
          fi

          echo "mode=file" >> "$GITHUB_OUTPUT"
          echo "path=${candidate}" >> "$GITHUB_OUTPUT"
          echo "Using schema ${candidate}."

      - name: Install Schemathesis
        env:
          VERSION: ${{ inputs.schemathesis-version }}
        run: |
          set -euo pipefail
          # defusedxml because the verdict step parses the JUnit report, and
          # that report embeds response bodies from the api under test. A
          # service that is compromised — or simply hostile, which is the case
          # a contract fuzzer is most likely to meet — could put entity
          # declarations there, and stdlib ElementTree will happily expand
          # them.
          python -m pip install --quiet "schemathesis==${VERSION}" "defusedxml==0.7.1"
          st --version

      # A deploy job returns when the platform accepts the release, not when
      # the container serves. Requests fired into that window fail with
      # connection errors indistinguishable from contract violations.
      - name: Wait For Deployment
        id: target
        env:
          BASE_URL: ${{ inputs.base-url }}
          HEALTH_PATH: ${{ inputs.health-path }}
          TIMEOUT: ${{ inputs.health-timeout-seconds }}
        run: |
          set -euo pipefail

          # The caller may hand over a service root or a URL that already ends
          # in the health path; the same secret feeds both. Appending blindly
          # turns a working /health into /health/health.
          base="${BASE_URL%/}"
          case "${base}" in
            *"${HEALTH_PATH}") base="${base%${HEALTH_PATH}}" ;;
          esac
          base="${base%/}"
          echo "base-url=${base}" >> "$GITHUB_OUTPUT"

          url="${base}${HEALTH_PATH}"
          echo "Probing ${url}"
          deadline=$(( SECONDS + TIMEOUT ))

          while [ "${SECONDS}" -lt "${deadline}" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${url}" || true)"
            if [ "${code}" = "200" ]; then
              echo "${url} answered 200 after ${SECONDS}s."
              exit 0
            fi
            sleep 5
          done

          echo "::error::${url} never answered 200 within ${TIMEOUT}s. The deployment is not serving, so a contract result would mean nothing."
          exit 1

      # Never fails the job on its own — the verdict step owns that, because a
      # zero exit is not the same as a run that exercised anything.
      - name: Run Contract Tests
        id: run
        continue-on-error: true
        env:
          MODE: ${{ steps.schema.outputs.mode }}
          SCHEMA_FILE: ${{ steps.schema.outputs.path }}
          SCHEMA_URL_PATH: ${{ inputs.schema-url-path }}
          BASE_URL: ${{ steps.target.outputs.base-url }}
          CHECKS: ${{ inputs.checks }}
          MAX_EXAMPLES: ${{ inputs.max-examples }}
        run: |
          set -uo pipefail

          if [ "${MODE}" = "url" ]; then
            target="${BASE_URL}${SCHEMA_URL_PATH}"
          else
            target="${SCHEMA_FILE}"
          fi

          st run "${target}" \
            --url "${BASE_URL}" \
            --checks "${CHECKS}" \
            --max-examples "${MAX_EXAMPLES}" \
            --report junit \
            --report-junit-path schemathesis.xml \
            2>&1 | tee schemathesis.log
          status=${PIPESTATUS[0]}
          echo "schemathesis exited ${status}"
          exit "${status}"

      # Why this is separate, and why it is not `if: success()`:
      #
      # A schema describing zero operations produces a clean run and a zero
      # exit. So does one whose paths were all filtered out. Either way the
      # api shipped with nothing checked while the job went green — the same
      # shape as an architecture test asserting over an empty type set.
      #
      # A pass therefore clears three bars: the tool exited clean, no check
      # failed, and at least one operation was actually exercised.
      - name: Verdict
        id: verdict
        if: always() && steps.schema.outcome == 'success'
        env:
          FAIL_ON_FAILURE: ${{ inputs.fail-on-failure }}
          SYSTEM_NAME: ${{ inputs.system-name }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import sys

          from defusedxml.ElementTree import ParseError, parse

          blocking = os.environ["FAIL_ON_FAILURE"] == "true"
          system = os.environ["SYSTEM_NAME"]
          run_outcome = os.environ["RUN_OUTCOME"]

          def emit(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1 if blocking else 0)

          operations = 0
          failures = 0

          try:
              root = parse("schemathesis.xml").getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  operations += int(suite.get("tests", 0))
                  failures += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          except (OSError, ParseError):
              # No report at all. Fall back to the log so a tool that died
              # before writing one is still described rather than guessed at.
              try:
                  with open("schemathesis.log", encoding="utf-8", errors="replace") as handle:
                      log = handle.read()
                  match = re.search(r"Tested:\s*(\d+)", log)
                  operations = int(match.group(1)) if match else 0
              except OSError:
                  operations = 0

          emit("operations", operations)
          emit("failures", failures)

          print(f"{system}: {operations} operation(s) tested, {failures} contract violation(s).")

          if operations == 0:
              fail(
                  f"Schemathesis exercised no operation against {system}. A schema that "
                  "describes nothing produces a clean run and proves nothing, so this is "
                  "not a pass."
              )
          elif failures:
              fail(
                  f"{system} violated its own API contract in {failures} case(s). "
                  "See the uploaded report: each names the request that broke it."
              )
          elif run_outcome != "success":
              fail(
                  f"Schemathesis exited non-zero for {system} while the report reads clean. "
                  "Refusing to call that a pass."
              )
          else:
              print(f"{system} honoured its API contract across {operations} operation(s).")
          PY

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schemathesis-${{ inputs.system-name }}
          path: |
            schemathesis.xml
            schemathesis.log
          if-no-files-found: warn
          retention-days: 14
