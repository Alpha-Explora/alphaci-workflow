# Contract: docs/workflows/vercel-deploy.md
# ╔══════════════════════════════════════════════════════════════════╗
# ║  REUSABLE: Vercel Deployment                                   ║
# ║  Handles UAT (preview) and Production deploys                 ║
# ║  Monorepo: each sub-project has its own VERCEL_PROJECT_ID     ║
# ║                                                                ║
# ║  Required repo secrets (per sub-project):                     ║
# ║    VERCEL_TOKEN              — shared Vercel API token         ║
# ║    VERCEL_ORG_ID             — shared Vercel Org/Team ID      ║
# ║    VERCEL_PROJECT_ID_BAYANIHUB_WEB                            ║
# ║    VERCEL_PROJECT_ID_DAMAYAN_WEB                              ║
# ║    VERCEL_PROJECT_ID_HOPECARD_WEB                             ║
# ╚══════════════════════════════════════════════════════════════════╝
name: "Reusable: Vercel Deploy"

on:
  workflow_call:
    inputs:
      system-name:
        required: false
        type: string
        default: ""
        description: "System name used for deployment metadata mapping"
      working-directory:
        required: true
        type: string
        description: "Project directory (e.g. BayaniHub-Web)"
      environment:
        required: false
        type: string
        default: "preview"
        description: "Deployment environment (preview|production)"
      branch-alias:
        required: false
        type: string
        default: ""
        description: "Stable hostname to point at this preview deploy, so a later stage can find it. Ignored for production, which already has one"
      require-branch-alias:
        required: false
        type: boolean
        default: true
        description: "Fail the deploy when branch-alias cannot be set (or the alias does not answer). The verify stage tests that alias, so the default is true; set false to only warn"
      checkout-ref:
        required: false
        type: string
        default: ""
        description: "Git ref to check out (workflow_run chains pass head_sha)"
      git-branch:
        required: false
        type: string
        default: ""
        description: "Branch whose preview Environment Variables the build pulls. Ignored for production, whose variables are not branch-scoped"
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      GH_PR_TOKEN:
        required: false
    outputs:
      deployment_alias:
        description: "The stable hostname, when one was requested and set"
        value: ${{ jobs.vercel-deploy.outputs.deployment_alias }}
      deployment_url:
        description: "Vercel deployment URL"
        value: ${{ jobs.vercel-deploy.outputs.url }}
      deployment_id:
        description: "Vercel deployment ID"
        value: ${{ jobs.vercel-deploy.outputs.id }}

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ inputs.environment }}-${{ inputs.system-name || inputs.working-directory }}
  cancel-in-progress: false

jobs:
  vercel-deploy:
    name: "Deploy to Vercel (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      id: ${{ steps.deploy.outputs.id }}
      deployment_alias: ${{ steps.deploy.outputs.alias }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Validate Project Directory
        run: |
          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found in ./${{ inputs.working-directory }}"
            echo "This usually means Vercel Root Directory is misconfigured for this project."
            echo "Set Vercel Root Directory to '.' for this linked sub-project context."
            exit 1
          fi
        working-directory: ./${{ inputs.working-directory }}

      - name: Install Vercel CLI
        run: npm install -g vercel@50.22.1

      - name: Pull and Build with Vercel (adaptive context)
        id: prepare
        run: |
          set -uo pipefail

          run_pull_build() {
            local dir="$1"
            echo "🔎 Trying Vercel pull/build in: $dir"

            pushd "$dir" > /dev/null

            # A preview variable scoped to one branch is only included when
            # the pull names that branch. Without it the uat build never saw
            # the API URL the platform wrote for uat, and shipped without one.
            local pull_args=(--yes --environment="${{ inputs.environment }}" --token="${VERCEL_TOKEN}")
            if [ "${{ inputs.environment }}" != "production" ] && [ -n "${PREVIEW_GIT_BRANCH}" ]; then
              pull_args+=(--git-branch="${PREVIEW_GIT_BRANCH}")
            fi

            vercel pull "${pull_args[@]}"
            local pull_status=$?
            if [ $pull_status -ne 0 ]; then
              echo "❌ vercel pull failed in $dir"
              popd > /dev/null
              return 1
            fi

            if [ "${{ inputs.environment }}" = "production" ]; then
              vercel build --prod --token="${VERCEL_TOKEN}"
            else
              vercel build --token="${VERCEL_TOKEN}"
            fi
            local build_status=$?
            if [ $build_status -ne 0 ]; then
              echo "❌ vercel build failed in $dir"
              popd > /dev/null
              return 1
            fi

            if [ ! -d ".vercel/output" ]; then
              echo "❌ .vercel/output not found in $dir"
              popd > /dev/null
              return 1
            fi

            popd > /dev/null
            return 0
          }

          if run_pull_build "./${{ inputs.working-directory }}"; then
            echo "deploy_dir=./${{ inputs.working-directory }}" >> "$GITHUB_OUTPUT"
            echo "✅ Using deploy directory: ./${{ inputs.working-directory }}"
          elif run_pull_build "."; then
            echo "deploy_dir=." >> "$GITHUB_OUTPUT"
            echo "✅ Using deploy directory: ."
          else
            echo "❌ Vercel pull/build failed in both contexts."
            echo "Check VERCEL_PROJECT_ID mapping and Root Directory in Vercel project settings."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PREVIEW_GIT_BRANCH: ${{ inputs.git-branch }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          # GitHub starts bash with -e; turn it off. Every failure below is
          # handled and reported explicitly (a bare -e would exit on the
          # `$(vercel deploy ...)` assignment before its output is printed).
          set +e
          set -uo pipefail

          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          META_ARGS=(--meta githubCommitRef="${BRANCH_NAME}" --meta githubCommitSha="${GITHUB_SHA}")
          if [ -n "${SYSTEM_NAME}" ]; then
            META_ARGS+=(--meta systemName="${SYSTEM_NAME}")
          fi

          DEPLOY_ARGS=(--prebuilt --token="${VERCEL_TOKEN}")
          if [ "${DEPLOY_ENVIRONMENT}" = "production" ]; then
            DEPLOY_ARGS+=(--prod)
          fi

          # The deployment URL is the ONLY thing `vercel deploy` writes to
          # stdout; progress, warnings and doc links go to stderr. Reading the
          # URL from the merged stream picked up whatever link was printed last
          # (CLI 50.x ends with https://vercel.link/unused-build-settings), and
          # every later step then ran against that link instead of the deploy.
          DEPLOY_LOG="${RUNNER_TEMP}/vercel-deploy.log"
          STDOUT=$(vercel deploy "${DEPLOY_ARGS[@]}" "${META_ARGS[@]}" 2>"${DEPLOY_LOG}")
          DEPLOY_STATUS=$?

          echo "::group::vercel deploy output"
          cat "${DEPLOY_LOG}"
          printf '%s\n' "${STDOUT}"
          echo "::endgroup::"

          if [ "${DEPLOY_STATUS}" -ne 0 ]; then
            echo "::error::vercel deploy exited with status ${DEPLOY_STATUS}."
            exit 1
          fi

          # Hosts that can appear in CLI output but are never a deployment.
          not_a_deployment() {
            [[ "$1" =~ (^|\.)(vercel\.link|vercel\.com)$ ]]
          }

          URL=""
          STDOUT_URLS=$(printf '%s\n' "${STDOUT}" | tr -d '\r' \
            | grep -E '^[[:space:]]*https://[A-Za-z0-9.-]+/?[[:space:]]*$' | sed -E 's/[[:space:]]+//g' || true)
          if [ "$(printf '%s\n' "${STDOUT_URLS}" | grep -c .)" = "1" ]; then
            CANDIDATE="${STDOUT_URLS%/}"
            if ! not_a_deployment "${CANDIDATE#https://}"; then
              URL="${CANDIDATE}"
            fi
          fi

          if [ -z "${URL}" ]; then
            # stdout did not hold exactly one usable URL. Fall back to the last
            # *.vercel.app deployment host anywhere in the output, never a
            # vercel.link / vercel.com documentation link.
            URL=$(printf '%s\n%s\n' "$(cat "${DEPLOY_LOG}")" "${STDOUT}" | tr -d '\r' \
              | grep -Eo 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1 || true)
            if [ -n "${URL}" ]; then
              echo "::warning::vercel deploy stdout was not a single URL; using the last *.vercel.app host in its output: ${URL}"
            fi
          fi

          if [ -z "${URL}" ]; then
            echo "::error::Failed to extract the deployment URL from vercel deploy output."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Deployed to: $URL"

          # Resolve the deployment's id AND its owner. `vercel alias` and
          # `vercel remove` are account-level: they run against the scope they
          # are given, and VERCEL_ORG_ID is not always the team that owns this
          # deployment (a mismatch is refused as "Not authorized: Trying to
          # access resource under scope ..."). The deployment itself knows its
          # owner, so ask it. The project's accountId is the second source.
          HOSTNAME="${URL#https://}"
          api_get() {
            curl -sS --max-time 30 -H "Authorization: Bearer ${VERCEL_TOKEN}" "$1" 2>/dev/null || true
          }
          QS_LIST=("")
          if [[ "${VERCEL_ORG_ID:-}" == team_* ]]; then
            QS_LIST+=("?teamId=${VERCEL_ORG_ID}")
          fi

          DEP_ID=""
          OWNER_ID=""
          for QS in "${QS_LIST[@]}"; do
            DEP_JSON=$(api_get "https://api.vercel.com/v13/deployments/${HOSTNAME}${QS}")
            DEP_ID=$(printf '%s' "${DEP_JSON}" | jq -r '.id // ""' 2>/dev/null || true)
            OWNER_ID=$(printf '%s' "${DEP_JSON}" | jq -r '.ownerId // ""' 2>/dev/null || true)
            if [ -n "${DEP_ID}" ] && [ -n "${OWNER_ID}" ]; then break; fi
          done
          if [ -z "${OWNER_ID}" ]; then
            for QS in "${QS_LIST[@]}"; do
              PROJECT_JSON=$(api_get "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}${QS}")
              OWNER_ID=$(printf '%s' "${PROJECT_JSON}" | jq -r '.accountId // ""' 2>/dev/null || true)
              if [ -n "${OWNER_ID}" ]; then break; fi
            done
          fi
          if [ -z "${DEP_ID}" ]; then
            DEP_ID=$(api_get "https://api.vercel.com/v13/deployments?url=${HOSTNAME}&projectId=${VERCEL_PROJECT_ID}&limit=1" \
              | jq -r '.deployments[0].uid // ""' 2>/dev/null || true)
          fi
          if [[ ! "${OWNER_ID}" =~ ^[A-Za-z0-9_]+$ ]]; then OWNER_ID=""; fi

          echo "id=${DEP_ID}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "${DEP_ID}" ]; then
            echo "🆔 Deployment ID: ${DEP_ID}"
          else
            echo "⚠️ Could not resolve deployment ID from Vercel API — id output will be empty."
          fi

          # --scope takes a team id only; a user id (personal account) is
          # rejected by the CLI and needs no scope. When the lookup produced
          # nothing, VERCEL_ORG_ID is the last resort, as before.
          SCOPE_ARGS=()
          if [[ "${OWNER_ID}" == team_* ]]; then
            SCOPE_ARGS=(--scope "${OWNER_ID}")
            echo "🏷️ Deployment owner: ${OWNER_ID}"
          elif [ -z "${OWNER_ID}" ] && [[ "${VERCEL_ORG_ID:-}" == team_* ]]; then
            SCOPE_ARGS=(--scope "${VERCEL_ORG_ID}")
            echo "::warning::Could not resolve the deployment owner; using VERCEL_ORG_ID as the alias scope."
          fi

          # Give a preview deploy a STABLE hostname.
          #
          # `vercel deploy` returns a URL unique to the deployment, and nothing
          # downstream can predict it. A later stage triggered by workflow_run
          # cannot read this job's outputs either, so without an alias a UI
          # suite has no address to point at — production works only because
          # --prod already lands on a fixed domain.
          #
          # A failure to alias FAILS this step (require-branch-alias, default
          # true). It used to be a warning, on the reasoning that the release
          # itself had succeeded. But the verify stage tests the alias, and
          # nothing else: a silent warning left every browser test running
          # against a hostname Vercel answers with 404 DEPLOYMENT_NOT_FOUND
          # while this job showed green. The deployment stays live either way;
          # the error names it. A caller that really wants the old behaviour
          # sets require-branch-alias: false.
          alias_failed() {
            local detail
            detail=$(printf '%s' "$1" | tr '\r\n' '  ' | cut -c1-400)
            if [ "${REQUIRE_BRANCH_ALIAS}" = "false" ]; then
              echo "::warning::Could not publish https://${ALIAS}: ${detail}. The deployment is live at ${URL}; anything addressing it by the stable name will not find it."
              return 0
            fi
            echo "::error::The UAT site the verify stage tests (https://${ALIAS}) could not be published: ${detail}. The deployment itself is live at ${URL}."
            exit 1
          }

          if [ -n "${ALIAS}" ] && [ "${DEPLOY_ENVIRONMENT}" != "production" ]; then
            if [[ ! "${ALIAS}" =~ ^[A-Za-z0-9.-]+$ ]]; then
              alias_failed "branch-alias '${ALIAS}' is not a valid hostname"
            else
              ALIAS_OK=false
              ALIAS_OUT=""
              for ATTEMPT in 1 2; do
                if ALIAS_OUT=$(vercel alias set "${URL}" "${ALIAS}" --token="${VERCEL_TOKEN}" "${SCOPE_ARGS[@]}" 2>&1); then
                  ALIAS_OK=true
                  break
                fi
                echo "vercel alias set failed (attempt ${ATTEMPT}): ${ALIAS_OUT}"
                sleep "${RETRY_DELAY:-3}"
              done

              if [ "${ALIAS_OK}" != "true" ]; then
                alias_failed "vercel alias set failed: ${ALIAS_OUT}"
              else
                echo "${ALIAS_OUT}"

                # Confirm the name really answers. A 404 carrying
                # X-Vercel-Error: DEPLOYMENT_NOT_FOUND means Vercel does not
                # route the hostname to any deployment, whatever alias set
                # said. Allow a few seconds for propagation. Other statuses
                # (401 from deployment protection, 200, an app 404) mean the
                # name routes, so they pass; an unreachable host is inconclusive.
                HDR_FILE="${RUNNER_TEMP}/alias-headers.txt"
                ALIAS_LIVE=unknown
                for CHECK in 1 2 3 4 5; do
                  : > "${HDR_FILE}"
                  CODE=$(curl -s -o /dev/null -D "${HDR_FILE}" -w '%{http_code}' --max-time 15 "https://${ALIAS}" || true)
                  echo "🔎 https://${ALIAS} -> HTTP ${CODE:-000} (check ${CHECK}/5)"
                  if [ "${CODE}" = "404" ] && grep -qi '^x-vercel-error:[[:space:]]*DEPLOYMENT_NOT_FOUND' "${HDR_FILE}"; then
                    ALIAS_LIVE=false
                    sleep "${RETRY_DELAY:-3}"
                  else
                    ALIAS_LIVE=true
                    break
                  fi
                done

                if [ "${ALIAS_LIVE}" = "false" ]; then
                  alias_failed "alias set reported success but https://${ALIAS} still answers 404 DEPLOYMENT_NOT_FOUND"
                else
                  echo "alias=https://${ALIAS}" >> "$GITHUB_OUTPUT"
                  echo "🔗 Aliased to: https://${ALIAS}"
                fi
              fi
            fi
          fi
        working-directory: ${{ steps.prepare.outputs.deploy_dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SYSTEM_NAME: ${{ inputs.system-name }}
          ALIAS: ${{ inputs.branch-alias }}
          REQUIRE_BRANCH_ALIAS: ${{ inputs.require-branch-alias }}

      - name: Cleanup previous branch preview deployments
        if: ${{ inputs.environment == 'preview' }}
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          if [ -z "${CURRENT_URL}" ]; then
            echo "⚠️ Current deployment URL is empty; skipping cleanup."
            exit 0
          fi
          CURRENT_HOST="${CURRENT_URL#https://}"

          API_URL="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=preview&meta-githubCommitRef=${BRANCH_NAME}&limit=100"
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "${API_URL}")

          if ! echo "${RESPONSE}" | jq -e . >/dev/null 2>&1; then
            echo "⚠️ Invalid response from Vercel API; skipping cleanup."
            exit 0
          fi

          # Safety: only delete when the deployment this run just made is
          # itself in the list. If the recorded URL is not a real deployment of
          # this branch (a mis-captured link, say), "everything that is not the
          # current URL" would include the live deployment, so remove nothing.
          if ! echo "${RESPONSE}" | jq -e --arg host "${CURRENT_HOST}" --arg id "${CURRENT_ID}" '
              [.deployments[]?
                | select((.url // "") == $host or ($id != "" and (.uid // "") == $id))
              ] | length > 0
            ' >/dev/null; then
            echo "⚠️ Current deployment ${CURRENT_HOST} not found among this branch's deployments; skipping cleanup."
            exit 0
          fi

          OLD_URLS=$(echo "${RESPONSE}" | jq -r --arg host "${CURRENT_HOST}" --arg id "${CURRENT_ID}" '
            [.deployments[]?
              | select((.state // "") == "READY")
              | select((.url // "") != "")
              | select(.url != $host)
              | select($id == "" or (.uid // "") != $id)
              | ("https://" + .url)
            ] | unique | .[]
          ')

          if [ -z "${OLD_URLS}" ]; then
            echo "ℹ️ No previous preview deployments found for branch '${BRANCH_NAME}'."
            exit 0
          fi

          # Same scope rule as the alias above: `vercel remove` is account-level,
          # so use the deployment's own owner, falling back to the org id.
          SCOPE_ARGS=()
          if [[ "${OWNER_ID}" == team_* ]]; then
            SCOPE_ARGS=(--scope "${OWNER_ID}")
          elif [ -z "${OWNER_ID}" ] && [[ "${VERCEL_ORG_ID:-}" == team_* ]]; then
            SCOPE_ARGS=(--scope "${VERCEL_ORG_ID}")
          fi

          echo "🧹 Removing previous preview deployments for branch '${BRANCH_NAME}'..."
          while IFS= read -r OLD_URL; do
            if [ -n "${OLD_URL}" ]; then
              echo "- Removing ${OLD_URL}"
              vercel remove "${OLD_URL}" --yes --token="${VERCEL_TOKEN}" "${SCOPE_ARGS[@]}" || echo "⚠️ Failed to remove ${OLD_URL}; continuing."
            fi
          done <<< "${OLD_URLS}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CURRENT_URL: ${{ steps.deploy.outputs.url }}
          CURRENT_ID: ${{ steps.deploy.outputs.id }}
          OWNER_ID: ${{ steps.deploy.outputs.owner }}

      - name: Comment Deployment URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        with:
          script: |
            if (!process.env.GH_TOKEN) {
              core.info('GH_PR_TOKEN is not set; skipping PR deployment comment.');
              return;
            }

            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Vercel Preview Deployment\n\n` +
              `**Project:** \`${{ inputs.working-directory }}\`\n` +
              `**Environment:** \`${{ inputs.environment }}\`\n` +
              `**URL:** ${url}\n` +
              `**Commit:** \`${{ github.sha }}\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
