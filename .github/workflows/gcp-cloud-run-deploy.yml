# Contract: docs/workflows/gcp-cloud-run-deploy.md
name: "Reusable: GCP Cloud Run Deploy"

on:
  workflow_call:
    secrets:
      CI_TOKEN:
        required: false
      CI_REPORT_URL:
        required: false
      ALPHACI_DEPLOYMENT_TARGET_ID:
        required: false
    inputs:
      system-name:
        required: true
        type: string
        description: "System name for display and labels"
      working-directory:
        required: false
        type: string
        default: "."
        description: "Project directory"
      checkout-ref:
        required: false
        type: string
        default: ""
        description: "Optional git ref/SHA to checkout"
      source-branch:
        required: false
        type: string
        default: ""
        description: "Source branch. Only test/preview, uat/uat, or main/prod may deploy."
      environment:
        required: false
        type: string
        default: "preview"
        description: "AlphaCI environment: preview, uat, or prod"
      gcp-project-id:
        required: true
        type: string
        description: "Target GCP project ID"
      gcp-region:
        required: true
        type: string
        description: "Target Cloud Run region"
      workload-identity-provider:
        required: true
        type: string
        description: "GitHub OIDC Workload Identity Provider resource name"
      deployer-service-account:
        required: true
        type: string
        description: "Service account impersonated by GitHub Actions"
      artifact-registry-repository:
        required: true
        type: string
        description: "Artifact Registry repository name"
      image-name:
        required: true
        type: string
        description: "Container image name"
      cloud-run-service-name:
        required: true
        type: string
        description: "Cloud Run service name"
      runtime-service-account:
        required: true
        type: string
        description: "Runtime identity attached to Cloud Run"
      deployment-target-id:
        required: false
        type: string
        default: ""
        description: "Workspace-scoped AlphaCI deployment target ID"
      docker-context:
        required: false
        type: string
        default: "."
        description: "Docker build context relative to working-directory"
      dockerfile-path:
        required: false
        type: string
        default: "Dockerfile"
        description: "Dockerfile path relative to working-directory"
      health-path:
        required: false
        type: string
        default: "/"
        description: "HTTP path to probe after deployment"
      correlation-id:
        required: false
        type: string
        default: ""
        description: "Caller-provided correlation ID for deployment history"
      workflow-release:
        required: false
        type: string
        default: "v1"
        description: "Central workflow release accepted by the AlphaCI control plane"
      estimated-runtime-credits:
        required: false
        type: number
        default: 1
        description: "Reserved runtime credit units for this deployment"
    outputs:
      service-url:
        description: "Cloud Run service URL"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.service-url }}
      image-uri:
        description: "Pushed Artifact Registry image URI with tag"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.image-uri }}
      image-digest:
        description: "Pushed Artifact Registry image digest"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.image-digest }}
      revision-name:
        description: "Latest ready Cloud Run revision name"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.revision-name }}
      deployment-status:
        description: "Safe deployment status"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.deployment-status }}
      correlation-id:
        description: "Correlation ID used for labels and deployment history"
        value: ${{ jobs.gcp-cloud-run-deploy.outputs.correlation-id }}

permissions:
  contents: read
  id-token: write

jobs:
  gcp-cloud-run-deploy:
    name: "Deploy ${{ inputs.system-name }} to Cloud Run"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      service-url: ${{ steps.service.outputs.url }}
      image-uri: ${{ steps.image.outputs.uri }}
      image-digest: ${{ steps.digest.outputs.digest }}
      revision-name: ${{ steps.service.outputs.revision-name }}
      deployment-status: ${{ steps.health.outputs.deployment-status }}
      correlation-id: ${{ steps.metadata.outputs.correlation-id }}
    defaults:
      run:
        working-directory: ./${{ inputs.working-directory }}
    env:
      SYSTEM_NAME: ${{ inputs.system-name }}
      GCP_PROJECT_ID: ${{ inputs.gcp-project-id }}
      GCP_REGION: ${{ inputs.gcp-region }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact-registry-repository }}
      IMAGE_NAME: ${{ inputs.image-name }}
      CLOUD_RUN_SERVICE_NAME: ${{ inputs.cloud-run-service-name }}
      RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime-service-account }}
      DOCKER_BUILD_CONTEXT: ${{ inputs.docker-context }}
      DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
      HEALTH_PATH: ${{ inputs.health-path }}
      ENVIRONMENT: ${{ inputs.environment }}
      SOURCE_BRANCH: ${{ inputs.source-branch }}
      CORRELATION_ID: ${{ inputs.correlation-id }}
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
      CI_REPORT_URL: ${{ secrets.CI_REPORT_URL }}
      DEPLOYMENT_TARGET_ID: ${{ inputs.deployment-target-id || secrets.ALPHACI_DEPLOYMENT_TARGET_ID }}
      WORKFLOW_RELEASE: ${{ inputs.workflow-release }}
      ESTIMATED_RUNTIME_CREDITS: ${{ inputs.estimated-runtime-credits }}
      CANDIDATE_TAG: alphaci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Validate inputs and branch mapping
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          set +x

          BRANCH="${SOURCE_BRANCH:-${GITHUB_REF_NAME}}"
          if [ -z "${BRANCH}" ]; then
            echo "::error::source-branch is required when github.ref_name is unavailable."
            exit 1
          fi

          if [ "${BRANCH}" == "test" ] && [ "${ENVIRONMENT}" == "preview" ]; then
            :
          elif [ "${BRANCH}" == "uat" ] && [ "${ENVIRONMENT}" == "uat" ]; then
            :
          elif [ "${BRANCH}" == "main" ] && [ "${ENVIRONMENT}" == "prod" ]; then
            :
          else
            echo "::error::Unsupported branch/environment mapping. Allowed: test->preview, uat->uat, main->prod."
            exit 1
          fi

          if [ -z "${GCP_PROJECT_ID}" ] || [ -z "${GCP_REGION}" ] || [ -z "${ARTIFACT_REGISTRY_REPOSITORY}" ]; then
            echo "::error::GCP project, region, and Artifact Registry repository are required."
            exit 1
          fi

          if [[ "${HEALTH_PATH}" != /* ]]; then
            echo "::error::health-path must start with '/'."
            exit 1
          fi

          if [ -z "${CLOUD_RUN_SERVICE_NAME}" ] || [ -z "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            echo "::error::Cloud Run service name and runtime service account are required."
            exit 1
          fi

          sanitize_label() {
            local value="$1"
            value="$(printf '%s' "${value}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g; s/^-+//; s/-+$//')"
            value="${value:0:63}"
            if [ -z "${value}" ]; then
              value="unknown"
            fi
            printf '%s' "${value}"
          }

          SAFE_REF="$(sanitize_label "${BRANCH}")"
          SAFE_SYSTEM="$(sanitize_label "${SYSTEM_NAME}")"
          SAFE_ENVIRONMENT="$(sanitize_label "${ENVIRONMENT}")"
          SAFE_CORRELATION="$(sanitize_label "${CORRELATION_ID:-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}")"

          {
            echo "source-branch=${BRANCH}"
            echo "safe-ref=${SAFE_REF}"
            echo "safe-system=${SAFE_SYSTEM}"
            echo "safe-environment=${SAFE_ENVIRONMENT}"
            echo "correlation-id=${SAFE_CORRELATION}"
          } >> "$GITHUB_OUTPUT"

      - name: Request runtime deployment approval
        id: runtime_approval
        if: ${{ env.ENVIRONMENT == 'preview' || env.ENVIRONMENT == 'uat' || env.ENVIRONMENT == 'prod' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${CI_TOKEN:-}" ] || [ -z "${CI_REPORT_URL:-}" ] || [ -z "${DEPLOYMENT_TARGET_ID:-}" ]; then
            echo "::error::CI_TOKEN, CI_REPORT_URL, and a workspace deployment target ID are required for runtime approval."
            exit 1
          fi

          CONTROL_PLANE_BASE="${CI_REPORT_URL%/api/v1/ci/report}"
          APPROVAL_URL="${CONTROL_PLANE_BASE}/api/v1/runtime-deployments/workflow/approve"
          REF="refs/heads/${{ steps.metadata.outputs.source-branch }}"
          REQUEST_BODY="$(jq -n \
            --arg target "${DEPLOYMENT_TARGET_ID}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg ref "${REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg release "${WORKFLOW_RELEASE}" \
            --arg key "${GITHUB_REPOSITORY}:${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --argjson credits "${ESTIMATED_RUNTIME_CREDITS}" \
            '{deploymentTargetId:$target,repositoryFullName:$repo,ref:$ref,commitSha:$sha,workflowRelease:$release,estimatedRuntimeCredits:$credits,idempotencyKey:$key}')"
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${REQUEST_BODY}" \
            "${APPROVAL_URL}")"

          DEPLOYMENT_ID="$(jq -er '.deploymentId' <<<"${RESPONSE}")"
          APPROVED_PROJECT_ID="$(jq -er '.gcpProjectId' <<<"${RESPONSE}")"
          APPROVED_WIF_PROVIDER="$(jq -er '.wif.workloadIdentityProvider' <<<"${RESPONSE}")"
          APPROVED_DEPLOYER_SERVICE_ACCOUNT="$(jq -er '.wif.deployerServiceAccount' <<<"${RESPONSE}")"
          APPROVED_REGION="$(jq -er '.target.region' <<<"${RESPONSE}")"
          APPROVED_ARTIFACT_REGISTRY_REPOSITORY="$(jq -er '.target.artifactRegistryRepository' <<<"${RESPONSE}")"
          APPROVED_IMAGE_NAME="$(jq -er '.target.imageName' <<<"${RESPONSE}")"
          APPROVED_CLOUD_RUN_SERVICE_NAME="$(jq -er '.target.cloudRunServiceName' <<<"${RESPONSE}")"
          APPROVED_RUNTIME_SERVICE_ACCOUNT="$(jq -er '.target.runtimeServiceAccount' <<<"${RESPONSE}")"

          {
            echo "deployment_id=${DEPLOYMENT_ID}"
            echo "gcp_project_id=${APPROVED_PROJECT_ID}"
            echo "wif_provider=${APPROVED_WIF_PROVIDER}"
            echo "deployer_service_account=${APPROVED_DEPLOYER_SERVICE_ACCOUNT}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "GCP_PROJECT_ID=${APPROVED_PROJECT_ID}"
            echo "GCP_REGION=${APPROVED_REGION}"
            echo "ARTIFACT_REGISTRY_REPOSITORY=${APPROVED_ARTIFACT_REGISTRY_REPOSITORY}"
            echo "IMAGE_NAME=${APPROVED_IMAGE_NAME}"
            echo "CLOUD_RUN_SERVICE_NAME=${APPROVED_CLOUD_RUN_SERVICE_NAME}"
            echo "RUNTIME_SERVICE_ACCOUNT=${APPROVED_RUNTIME_SERVICE_ACCOUNT}"
            echo "WORKFLOW_APPROVAL_URL=${APPROVAL_URL}"
          } >> "$GITHUB_ENV"
      - name: Validate OIDC permission
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::Missing GitHub OIDC token permission. Caller and reusable workflow must allow id-token: write."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.runtime_approval.outputs.wif_provider || inputs.workload-identity-provider }}
          service_account: ${{ steps.runtime_approval.outputs.deployer_service_account || inputs.deployer-service-account }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify GCP deployment target
        shell: bash
        run: |
          set -euo pipefail
          set +x

          gcloud config set project "${GCP_PROJECT_ID}" --quiet

          for api in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com; do
            if ! gcloud services list \
              --project "${GCP_PROJECT_ID}" \
              --enabled \
              --filter="config.name=${api}" \
              --format="value(config.name)" | grep -Fxq "${api}"; then
              echo "::error::Required API ${api} is not enabled for ${GCP_PROJECT_ID}."
              exit 1
            fi
          done

          gcloud artifacts repositories describe "${ARTIFACT_REGISTRY_REPOSITORY}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${GCP_REGION}" \
            --format="value(name)" >/dev/null

          gcloud iam service-accounts describe "${RUNTIME_SERVICE_ACCOUNT}" \
            --project "${GCP_PROJECT_ID}" \
            --format="value(email)" >/dev/null

      - name: Configure Artifact Registry Docker auth
        shell: bash
        run: |
          set -euo pipefail
          set +x
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Compute image URI
        id: image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${{ steps.metadata.outputs.safe-ref }}-${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker build \
            --file "${DOCKERFILE_PATH}" \
            --tag "${{ steps.image.outputs.uri }}" \
            "${DOCKER_BUILD_CONTEXT}"

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker push "${{ steps.image.outputs.uri }}"

      - name: Resolve image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          set +x
          DIGEST="$(gcloud artifacts docker images describe "${{ steps.image.outputs.uri }}" --format="value(image_summary.digest)")"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Unable to resolve pushed image digest."
            exit 1
          fi

          IMAGE_WITHOUT_TAG="${{ steps.image.outputs.uri }}"
          IMAGE_WITHOUT_TAG="${IMAGE_WITHOUT_TAG%:*}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest-uri=${IMAGE_WITHOUT_TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run service without traffic
        shell: bash
        run: |
          set -euo pipefail
          set +x
          gcloud run deploy "${CLOUD_RUN_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.digest.outputs.digest-uri }}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --platform managed \
            --no-allow-unauthenticated \
            --no-traffic \
            --tag "${CANDIDATE_TAG}" \
            --labels "alphaci_managed=true,alphaci_system=${{ steps.metadata.outputs.safe-system }},alphaci_environment=${{ steps.metadata.outputs.safe-environment }},alphaci_correlation=${{ steps.metadata.outputs.correlation-id }},alphaci_commit=${GITHUB_SHA}" \
            --async \
            --quiet

      - name: Wait for ready Cloud Run revision
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for attempt in $(seq 1 60); do
            echo "Waiting for ready Cloud Run revision (attempt ${attempt}/60)..."
            SERVICE_JSON="$(gcloud run services describe "${CLOUD_RUN_SERVICE_NAME}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --format=json 2>/dev/null || true)"
            REVISION_NAME="$(jq -r '.status.latestCreatedRevisionName // .status.latestReadyRevisionName // empty' <<<"${SERVICE_JSON}")"
            if [ -n "${REVISION_NAME}" ]; then
              REVISION_JSON="$(gcloud run revisions describe "${REVISION_NAME}" \
                --project "${GCP_PROJECT_ID}" \
                --region "${GCP_REGION}" \
                --format=json 2>/dev/null || true)"
              READY_STATUS="$(jq -r '.status.conditions[]? | select(.type == "Ready") | .status // empty' <<<"${REVISION_JSON}")"
              if [ "${READY_STATUS}" = "True" ]; then
                echo "revision-name=${REVISION_NAME}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "${READY_STATUS}" = "False" ]; then
                echo "::error::Cloud Run revision ${REVISION_NAME} failed readiness."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for a ready Cloud Run revision."
          exit 1
      - name: Read service URL and revision
        id: service
        shell: bash
        run: |
          set -euo pipefail
          set +x
          SERVICE_JSON="$(gcloud run services describe "${CLOUD_RUN_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          URL="$(jq -r '.status.url // empty' <<<"${SERVICE_JSON}")"
          if [ -z "${URL}" ]; then
            URL="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] // "[]" | fromjson | .[0] // empty' <<<"${SERVICE_JSON}")"
          fi
          REVISION_NAME="${{ steps.ready.outputs.revision-name }}"
          CANDIDATE_URL="$(jq -r --arg tag "${CANDIDATE_TAG}" \
            '.status.traffic[]? | select(.tag == $tag) | .url // empty' \
            <<<"${SERVICE_JSON}")"
          if [ -z "${CANDIDATE_URL}" ] && [ -n "${URL}" ]; then
            CANDIDATE_URL="$(printf '%s' "${URL}" | sed "s#^https://#https://${CANDIDATE_TAG}---#")"
          fi
          if [ -z "${URL}" ] || [ -z "${REVISION_NAME}" ] || [ -z "${CANDIDATE_URL}" ]; then
            echo "::error::Cloud Run did not report a ready tagged candidate revision."
            exit 1
          fi
          {
            echo "url=${URL}"
            echo "candidate-url=${CANDIDATE_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "revision-name=${REVISION_NAME}" >> "$GITHUB_OUTPUT"
      - name: Probe service health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          set +x
          HEALTH_URL="${{ steps.service.outputs.candidate-url }}${HEALTH_PATH}"
          IDENTITY_TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${{ steps.runtime_approval.outputs.deployer_service_account || inputs.deployer-service-account }}" --audiences="${{ steps.service.outputs.url }}")"
          curl -fsS -H "Authorization: Bearer ${IDENTITY_TOKEN}" "${HEALTH_URL}" >/dev/null
          echo "deployment-status=healthy" >> "$GITHUB_OUTPUT"

      - name: Promote healthy revision
        shell: bash
        run: |
          set -euo pipefail
          set +x
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${{ steps.service.outputs.revision-name }}=100" \
            --quiet

      - name: Report runtime deployment result
        if: ${{ always() && steps.runtime_approval.outputs.deployment_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          STATUS="succeeded"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="canceled"
          elif [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
          fi

          SAFE_ERROR_CODE=""
          SAFE_ERROR_MESSAGE=""
          if [ "${STATUS}" != "succeeded" ]; then
            SAFE_ERROR_CODE="GCP_WORKFLOW_FAILED"
            SAFE_ERROR_MESSAGE="Cloud Run deployment workflow did not complete successfully"
          fi

          REPORT_BODY="$(jq -n \
            --arg deploymentId "${{ steps.runtime_approval.outputs.deployment_id }}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg callbackKey "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --arg status "${STATUS}" \
            --arg digest "${{ steps.digest.outputs.digest }}" \
            --arg revision "${{ steps.service.outputs.revision-name }}" \
            --arg serviceUrl "${{ steps.service.outputs.url }}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg errorCode "${SAFE_ERROR_CODE}" \
            --arg errorMessage "${SAFE_ERROR_MESSAGE}" \
            '{deploymentId:$deploymentId,repositoryFullName:$repo,callbackKey:$callbackKey,status:$status,imageDigest:($digest // null),cloudRunRevision:($revision // null),serviceUrl:($serviceUrl // null),workflowRunId:$runId,safeErrorCode:($errorCode // null),safeErrorMessage:($errorMessage // null)}')"

          CONTROL_PLANE_BASE="${CI_REPORT_URL%/api/v1/ci/report}"
          REPORT_URL="${CONTROL_PLANE_BASE}/api/v1/runtime-deployments/workflow/report"
          if ! curl -fsS \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${REPORT_BODY}" \
            "${REPORT_URL}" >/dev/null; then
            echo "::warning::AlphaCI runtime deployment result could not be reported."
          fi
