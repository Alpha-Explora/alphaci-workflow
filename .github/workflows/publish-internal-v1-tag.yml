# Contract: docs/workflows/publish-internal-v1-tag.md
# ╔══════════════════════════════════════════════════════════════════╗
# ║  Publish floating internal-v1 tag                                  ║
# ║                                                                    ║
# ║  Pipelines generated by the INTERNAL Alphaexplora deployment pin   ║
# ║  the reusable workflows at @internal-v1 (the internal BE sets      ║
# ║  CENTRAL_WORKFLOW_REF=internal-v1). This is a separate, indepen-   ║
# ║  dently-movable tag from the customer-facing @v1 line so internal  ║
# ║  workflow changes can never affect paying customers, and vice-     ║
# ║  versa.                                                            ║
# ║                                                                    ║
# ║  Two instances, two lines:                                         ║
# ║    main             → v1          (sold product; publish-v1-tag)   ║
# ║    refactor-internal→ internal-v1 (this workflow)                  ║
# ║                                                                    ║
# ║  Every push to refactor-internal force-moves internal-v1 to that   ║
# ║  commit, so the internal line versions independently of main/v1.   ║
# ╚══════════════════════════════════════════════════════════════════╝
name: "Publish internal-v1 tag"

on:
  push:
    branches: [refactor-internal]
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two retag runs race; the newest commit wins.
concurrency:
  group: publish-internal-v1-tag
  cancel-in-progress: true

jobs:
  # Gated for the same reason as the v1 line: the internal branch is not a
  # pull_request target either, so without this the internal tag would move to
  # an unvalidated commit. Internal pipelines break just as loudly as customer
  # ones — they are simply harder to notice.
  validate:
    name: "Validate before tagging"
    uses: ./.github/workflows/workflow-validation.yml

  retag:
    name: "Move internal-v1 to current commit"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force-move internal-v1 tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f internal-v1 "${GITHUB_SHA}"
          git push -f origin "refs/tags/internal-v1"
          echo "✅ internal-v1 now points at ${GITHUB_SHA}"
