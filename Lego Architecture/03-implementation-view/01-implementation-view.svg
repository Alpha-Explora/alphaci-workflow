<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820" role="img" aria-labelledby="title desc">
  <title id="title">AlphaCI Lego Architecture Implementation View</title>
  <desc id="desc">Implementation view showing workflow call inputs, reusable jobs, evidence outputs, permissions and Cloud Run deployment contract.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker><style>
    .t{font:700 28px 'Segoe UI',sans-serif;fill:#172033}.s{font:400 15px 'Segoe UI',sans-serif;fill:#475569}.h{font:700 15px 'Segoe UI',sans-serif;fill:#172033}.x{font:400 12px 'Segoe UI',sans-serif;fill:#334155}.i{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.j{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.e{fill:#fce7f3;stroke:#be185d;stroke-width:2}.g{fill:#dcfce7;stroke:#15803d;stroke-width:2}.y{fill:#fff7d6;stroke:#c58a00;stroke-width:2}.l{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}
  </style></defs>
  <rect width="1700" height="820" fill="#fff"/><text x="60" y="58" class="t">Layer 3 · Workflow Implementation</text><text x="60" y="88" class="s">The concrete contract: inputs enter, jobs gate, outputs carry evidence, and deployment returns auditable status.</text>
  <rect x="60" y="135" width="330" height="190" rx="10" class="i"/><text x="85" y="170" class="h">workflow_call inputs</text><text x="85" y="198" class="x">service-name | service-path</text><text x="85" y="220" class="x">stack | runtime | commands</text><text x="85" y="242" class="x">coverage and audit flags</text><text x="85" y="264" class="x">UAT URLs and approvals</text><text x="85" y="296" class="x">secrets inherited, never generated</text>
  <rect x="470" y="135" width="330" height="190" rx="10" class="j"/><text x="495" y="170" class="h">Reusable jobs</text><text x="495" y="198" class="x">validate subscription</text><text x="495" y="220" class="x">static analysis + tests</text><text x="495" y="242" class="x">build + upload artifact</text><text x="495" y="264" class="x">UAT and production gate</text><text x="495" y="296" class="x">needs / if / environment</text>
  <rect x="880" y="135" width="330" height="190" rx="10" class="e"/><text x="905" y="170" class="h">Evidence outputs</text><text x="905" y="198" class="x">test and coverage reports</text><text x="905" y="220" class="x">build artifact and digest</text><text x="905" y="242" class="x">health and UAT result</text><text x="905" y="264" class="x">correlation and audit metadata</text><text x="905" y="296" class="x">all enabled lanes must report</text>
  <path d="M390 230 H470" class="l"/><path d="M800 230 H880" class="l"/>
  <rect x="1290" y="135" width="330" height="190" rx="10" class="g"/><text x="1315" y="170" class="h">Deployment outputs</text><text x="1315" y="198" class="x">service URL</text><text x="1315" y="220" class="x">image URI and digest</text><text x="1315" y="242" class="x">revision name</text><text x="1315" y="264" class="x">deployment status</text><text x="1315" y="296" class="x">Cloud Run candidate then promote</text><path d="M1210 230 H1290" class="l"/>
  <rect x="130" y="455" width="330" height="160" rx="10" class="y"/><text x="155" y="490" class="h">Security controls</text><text x="155" y="518" class="x">contents: read</text><text x="155" y="540" class="x">id-token: write only for OIDC</text><text x="155" y="562" class="x">environment-scoped approvals</text><text x="155" y="584" class="x">stable workflow release</text>
  <rect x="685" y="455" width="330" height="160" rx="10" class="j"/><text x="710" y="490" class="h">Contract checks</text><text x="710" y="518" class="x">catalog compatibility</text><text x="710" y="540" class="x">required variable and secret setup</text><text x="710" y="562" class="x">workflow validation scripts</text><text x="710" y="584" class="x">representative consumer run</text>
  <rect x="1240" y="455" width="330" height="160" rx="10" class="i"/><text x="1265" y="490" class="h">Provider boundary</text><text x="1265" y="518" class="x">artifact input</text><text x="1265" y="540" class="x">branch/environment mapping</text><text x="1265" y="562" class="x">health path and candidate mode</text><text x="1265" y="584" class="x">status and audit output</text>
  <path d="M1045 325 V400 H295 V455" class="l"/><path d="M1045 325 V455 H850" class="l"/><path d="M1455 325 V455" class="l"/>
  <text x="60" y="740" class="s">Implementation view: engineers change contracts and adapters here, while preserving the top-level phase and gate model.</text>
</svg>
