<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">AlphaCI Plug-and-Play Workflow Technical Architecture</title>
  <desc id="desc">Technical architecture showing catalog selection, generated thin caller, reusable workflow orchestration, profile and variable switching, five execution phases, tool adapters, immutable artifacts, and environment promotion.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#15803d"/></marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172033; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #475569; }
      .section { font: 700 16px 'Segoe UI', sans-serif; fill: #1e293b; }
      .box { font: 700 14px 'Segoe UI', sans-serif; fill: #0f172a; }
      .text { font: 400 12px 'Segoe UI', sans-serif; fill: #334155; }
      .tiny { font: 600 11px 'Segoe UI', sans-serif; fill: #475569; }
      .control { fill: #fff7d6; stroke: #c58a00; stroke-width: 2; }
      .caller { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .orchestrator { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .phase { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .tool { fill: #fce7f3; stroke: #be185d; stroke-width: 2; }
      .release { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .future { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#blue-arrow); }
      .green-line { fill: none; stroke: #15803d; stroke-width: 2.2; marker-end: url(#green-arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#ffffff"/>
  <text x="70" y="62" class="title">AlphaCI Plug-and-Play Workflow Architecture</text>
  <text x="70" y="91" class="subtitle">One generated caller selects a contract; reusable workflows assemble the right tools, gates, artifacts, and deployment path.</text>

  <rect x="60" y="125" width="1680" height="205" rx="12" fill="#fffbeb" stroke="#f1c453" stroke-width="2"/>
  <text x="85" y="157" class="section">1. Selection and provisioning plane</text>
  <rect x="90" y="185" width="235" height="105" rx="9" class="control"/>
  <text x="110" y="213" class="box">Product request</text>
  <text x="110" y="237" class="text">repo shape | stack | plan</text>
  <text x="110" y="258" class="text">environment | provider</text>
  <text x="110" y="279" class="text">enabled capabilities</text>
  <rect x="390" y="185" width="260" height="105" rx="9" class="control"/>
  <text x="410" y="213" class="box">Catalog resolver</text>
  <text x="410" y="237" class="text">project-types.json</text>
  <text x="410" y="258" class="text">workflow-recipes.json</text>
  <text x="410" y="279" class="text">plans + action compatibility</text>
  <rect x="715" y="185" width="270" height="105" rx="9" class="caller"/>
  <text x="735" y="213" class="box">Generated thin caller</text>
  <text x="735" y="237" class="text">master-pipeline-fe/be.yml</text>
  <text x="735" y="258" class="text">cicd.config.json</text>
  <text x="735" y="279" class="text">stable reusable-workflow ref</text>
  <rect x="1050" y="185" width="290" height="105" rx="9" class="control"/>
  <text x="1070" y="213" class="box">Runtime inputs</text>
  <text x="1070" y="237" class="text">stack | commands | paths</text>
  <text x="1070" y="258" class="text">branch | environment | flags</text>
  <text x="1070" y="279" class="text">secrets references only</text>
  <rect x="1405" y="185" width="285" height="105" rx="9" class="future"/>
  <text x="1425" y="213" class="box">Extension registry</text>
  <text x="1425" y="237" class="text">new stack or provider</text>
  <text x="1425" y="258" class="text">same contract, new adapter</text>
  <text x="1425" y="279" class="tiny">planned extension boundary</text>
  <path d="M325 237 H390" class="line"/><path d="M650 237 H715" class="line"/><path d="M985 237 H1050" class="line"/><path d="M1340 237 H1405" class="dashed"/>

  <rect x="60" y="365" width="1680" height="220" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="85" y="397" class="section">2. Reusable orchestration plane</text>
  <rect x="95" y="430" width="300" height="115" rx="9" class="orchestrator"/>
  <text x="118" y="458" class="box">Versioned orchestrator</text>
  <text x="118" y="482" class="text">workflow_call contract</text>
  <text x="118" y="503" class="text">permissions | concurrency</text>
  <text x="118" y="524" class="text">needs | outputs | conditions</text>
  <rect x="455" y="430" width="300" height="115" rx="9" class="orchestrator"/>
  <text x="478" y="458" class="box">Profile resolver</text>
  <text x="478" y="482" class="text">frontend / backend / mobile</text>
  <text x="478" y="503" class="text">single / fullstack / matrix</text>
  <text x="478" y="524" class="text">current + planned adapters</text>
  <rect x="815" y="430" width="300" height="115" rx="9" class="orchestrator"/>
  <text x="838" y="458" class="box">Capability switches</text>
  <text x="838" y="482" class="text">lint | unit | coverage</text>
  <text x="838" y="503" class="text">security | e2e | docker</text>
  <text x="838" y="524" class="text">deploy | approval | promotion</text>
  <rect x="1175" y="430" width="485" height="115" rx="9" class="orchestrator"/>
  <text x="1198" y="458" class="box">Shared phase runner</text>
  <text x="1198" y="482" class="text">same five-phase contract for every enabled lane</text>
  <text x="1198" y="503" class="text">Access → Guard → Quality → Verify → Package</text>
  <text x="1198" y="524" class="tiny">parallel lanes converge at one release decision</text>
  <path d="M395 487 H455" class="blue-line"/><path d="M755 487 H815" class="blue-line"/><path d="M1115 487 H1175" class="blue-line"/>

  <rect x="60" y="620" width="1680" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="652" class="section">3. Execution plane: five phases with interchangeable tool adapters</text>
  <rect x="90" y="685" width="285" height="190" rx="9" class="phase"/>
  <text x="112" y="715" class="box">Phase 1 · Access gate</text>
  <text x="112" y="742" class="text">subscription / trust</text>
  <text x="112" y="763" class="text">secret exposure scan</text>
  <text x="112" y="784" class="text">caller contract check</text>
  <text x="112" y="822" class="tiny">fail fast; no later phase runs</text>
  <rect x="415" y="685" width="285" height="190" rx="9" class="phase"/>
  <text x="437" y="715" class="box">Phase 2 · Environment guard</text>
  <text x="437" y="742" class="text">dependency audit</text>
  <text x="437" y="763" class="text">runtime and branch policy</text>
  <text x="437" y="784" class="text">environment readiness</text>
  <text x="437" y="822" class="tiny">blocking risk thresholds apply</text>
  <rect x="740" y="685" width="285" height="190" rx="9" class="phase"/>
  <text x="762" y="715" class="box">Phase 3 · Quality gate</text>
  <text x="762" y="742" class="text">lint | typecheck | build</text>
  <text x="762" y="763" class="text">unit tests | coverage</text>
  <text x="762" y="784" class="text">SAST / quality policy</text>
  <text x="762" y="822" class="tiny">tools vary; gate contract does not</text>
  <rect x="1065" y="685" width="285" height="190" rx="9" class="phase"/>
  <text x="1087" y="715" class="box">Phase 4 · Verify</text>
  <text x="1087" y="742" class="text">unit integration / E2E</text>
  <text x="1087" y="763" class="text">health / smoke / performance</text>
  <text x="1087" y="784" class="text">candidate environment tests</text>
  <text x="1087" y="822" class="tiny">proof before promotion</text>
  <rect x="1390" y="685" width="285" height="190" rx="9" class="phase"/>
  <text x="1412" y="715" class="box">Phase 5 · Package</text>
  <text x="1412" y="742" class="text">immutable artifact</text>
  <text x="1412" y="763" class="text">image / bundle / mobile build</text>
  <text x="1412" y="784" class="text">digest and audit metadata</text>
  <text x="1412" y="822" class="tiny">release gate consumes outputs</text>
  <path d="M375 780 H415" class="line"/><path d="M700 780 H740" class="line"/><path d="M1025 780 H1065" class="line"/><path d="M1350 780 H1390" class="line"/>

  <rect x="60" y="965" width="1680" height="230" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="85" y="997" class="section">4. Release and extension plane</text>
  <rect x="100" y="1030" width="285" height="110" rx="9" class="tool"/>
  <text x="122" y="1058" class="box">Tool adapter catalog</text>
  <text x="122" y="1082" class="text">ESLint | Vitest | Playwright</text>
  <text x="122" y="1103" class="text">xUnit | Bruno | k6 | Maestro</text>
  <text x="122" y="1124" class="text">adapter selected by profile</text>
  <rect x="470" y="1030" width="320" height="110" rx="9" class="release"/>
  <text x="492" y="1058" class="box">Artifact and evidence</text>
  <text x="492" y="1082" class="text">registry | test reports | SBOM</text>
  <text x="492" y="1103" class="text">digest | summary | audit record</text>
  <text x="492" y="1124" class="text">no mutable release input</text>
  <rect x="875" y="1030" width="320" height="110" rx="9" class="release"/>
  <text x="897" y="1058" class="box">Promotion gate</text>
  <text x="897" y="1082" class="text">branch policy | environment approval</text>
  <text x="897" y="1103" class="text">all enabled lanes must pass</text>
  <text x="897" y="1124" class="text">test → uat → prod</text>
  <rect x="1280" y="1030" width="395" height="110" rx="9" class="release"/>
  <text x="1302" y="1058" class="box">Provider deployment adapter</text>
  <text x="1302" y="1082" class="text">current: Artifact Registry → Cloud Run</text>
  <text x="1302" y="1103" class="text">candidate no-traffic → health probe</text>
  <text x="1302" y="1124" class="text">future providers implement same contract</text>
  <path d="M385 1085 H470" class="green-line"/><path d="M790 1085 H875" class="green-line"/><path d="M1195 1085 H1280" class="green-line"/>

  <path d="M850 290 V430" class="blue-line"/>
  <path d="M1320 545 V685" class="blue-line"/>
  <path d="M1530 875 V1030" class="green-line"/>
  <path d="M242 1030 V930" class="dashed"/>
  <text x="252" y="955" class="tiny">adapters plug into phases</text>

  <text x="70" y="1242" class="tiny">Canonical boundary: generated callers configure; reusable workflows decide; catalog metadata selects; adapters execute; gates promote.</text>
</svg>
